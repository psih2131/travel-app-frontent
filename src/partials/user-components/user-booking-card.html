<a href="{{cardUrl}}" class="user-booking-card user-booking-card--{{statusModifier}}">
    <div class="user-booking-card__tour-thumb">
        <div class="user-booking-card__tour-thumb-inner">
            <img class="user-booking-card__tour-img" src="{{tourImage}}" alt="" width="96" height="96" />
        </div>
    </div>

    <div class="user-booking-card__tour">
        <p class="user-booking-card__tour-title">{{tourTitle}}</p>
        <p class="user-booking-card__tour-subtitle">{{tourSubtitle}}</p>
    </div>

    <div class="user-booking-card__date">
        <p class="user-booking-card__date-label">Дата тура</p>
        <p class="user-booking-card__date-main">{{dateMain}}</p>
        <p class="user-booking-card__date-sub">{{dateSub}}</p>
    </div>

    <div class="user-booking-card__price">
        <span class="user-booking-card__price-value">{{priceValue}}</span>
    </div>

    <div class="user-booking-card__status-wrap">
        <span class="user-booking-card__status user-booking-card__status--{{statusModifier}}">{{statusText}}</span>
    </div>

    <div class="user-booking-card__messages">
        <span class="user-booking-card__messages-icon-wrap">
            <svg class="user-booking-card__messages-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
            {{#if unreadText}}
            <span class="user-booking-card__messages-badge">{{unreadText}}</span>
            {{/if}}
        </span>
    </div>
</a>
